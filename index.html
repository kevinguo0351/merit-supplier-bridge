<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merit Supplier Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13243A; --paper:#F7F9FB; --blue:#2563C9; --amber:#E8A317;
  --green:#2E8B57; --red:#C0392B; --steel:#6B7A8C;
  --line:#C9D3DD; --panel:#FFFFFF;
  /* treatment tiers */
  --t-support:#D9480F; --t-harvest:#2563C9; --t-shared:#D6A20A; --t-light:#16A085; --t-escalate:#8B1E1E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Atkinson Hyperlegible","Noto Sans SC",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--paper); color:var(--ink); font-size:15px; line-height:1.45;
}
:lang(zh){font-family:"Noto Sans SC","Atkinson Hyperlegible",system-ui,sans-serif;}
h1,h2,h3{font-weight:700; line-height:1.2; margin:0 0 .4em}
a{color:var(--blue)}
button{font-family:inherit; font-size:14px; cursor:pointer}
:focus-visible{outline:3px solid var(--amber); outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
header{background:var(--ink); color:#fff; padding:14px 22px; display:flex; flex-wrap:wrap; align-items:center; gap:14px}
header .brand{display:flex; flex-direction:column}
header .brand .en{font-size:19px; font-weight:700}
header .brand .sub{font-size:12px; color:#AFC0D4}
header .spacer{flex:1}
.langsw{display:flex; border:1px solid #42546B; border-radius:6px; overflow:hidden}
.langsw button{background:transparent; color:#CDD9E6; border:none; padding:6px 12px}
.langsw button[aria-pressed="true"]{background:var(--blue); color:#fff}
.btn{background:var(--blue); color:#fff; border:none; border-radius:6px; padding:8px 14px; font-weight:700}
.btn.ghost{background:transparent; color:#CDD9E6; border:1px solid #42546B}
.btn.sm{padding:5px 10px; font-size:13px}
.btn.sec{background:#fff; color:var(--ink); border:1px solid var(--line)}

/* tabs */
nav.tabs{display:flex; gap:2px; background:var(--ink); padding:0 22px}
nav.tabs button{background:transparent; border:none; color:#AFC0D4; padding:12px 18px; font-weight:700; font-size:15px; border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:#fff; border-bottom-color:var(--amber)}

main{padding:20px 22px 40px; max-width:1680px; margin:0 auto}
.view{display:none}
.view.active{display:block}

/* title-block panel motif */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:4px; margin-bottom:18px}
.panel>.hdr{display:flex; align-items:center; gap:10px; flex-wrap:wrap; border-bottom:1px solid var(--line); background:#EEF3F8; padding:7px 12px; font-size:12px; color:var(--steel)}
.panel>.hdr .ttl{font-weight:700; color:var(--ink); font-size:14px}
.panel>.hdr .meta{font-family:ui-monospace,Menlo,Consolas,monospace; letter-spacing:.3px}
.panel>.bd{padding:14px}
.illus{display:inline-block; background:#FDF3D7; color:#8a6400; border:1px solid var(--amber); border-radius:3px; padding:2px 8px; font-size:12px; font-weight:700}

/* controls row */
.controls{display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end}
.ctl{display:flex; flex-direction:column; gap:4px; font-size:13px}
.ctl label{font-weight:700; color:var(--steel)}
.toggle{display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden}
.toggle button{background:#fff; border:none; padding:7px 12px; color:var(--steel); font-weight:700}
.toggle button[aria-pressed="true"]{background:var(--blue); color:#fff}
.readout{font-size:13px; background:#EEF3F8; border:1px solid var(--line); border-radius:4px; padding:8px 12px}
.readout b{color:var(--blue)}

/* matrix layout */
.triage-grid{display:grid; grid-template-columns:minmax(440px,1fr) minmax(520px,1.1fr); gap:18px; align-items:start}
@media(max-width:1100px){.triage-grid{grid-template-columns:1fr}}

svg.matrix{width:100%; height:auto; display:block; background:#fff}
.dot{cursor:pointer}
@media (prefers-reduced-motion: no-preference){ .dot{transition:cx .9s cubic-bezier(.4,0,.2,1), cy .9s ease} }

/* table */
.tblwrap{overflow:auto; max-height:640px; border:1px solid var(--line); border-radius:4px}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{padding:6px 9px; text-align:left; border-bottom:1px solid #E4EAF0; white-space:nowrap}
th{position:sticky; top:0; background:#EEF3F8; z-index:2; font-size:12px; color:var(--steel)}
tbody tr:hover{background:#F2F7FF}
tr.topn{background:#FFF8E6}
tr.topn:hover{background:#FFF1CC}
td.num{text-align:right; font-variant-numeric:tabular-nums}

/* inspection tag chips */
.tag{display:inline-block; padding:2px 8px; border-radius:2px; font-size:12px; font-weight:700; border:1px solid; position:relative; padding-left:16px}
.tag::before{content:""; position:absolute; left:5px; top:50%; width:5px; height:5px; border-radius:50%; transform:translateY(-50%); background:currentColor}
.tag.ns{color:var(--steel); border-color:var(--steel); background:#F1F4F7}
.tag.up{color:#8a6400; border-color:var(--amber); background:#FDF3D7}
.tag.rv{color:var(--blue); border-color:var(--blue); background:#E7F0FF}
.tag.vf{color:var(--green); border-color:var(--green); background:#E4F3EA}

.treat{display:inline-block; padding:2px 9px; border-radius:2px; color:#fff; font-size:12px; font-weight:700}
.treat.support{background:var(--t-support)} .treat.harvest{background:var(--t-harvest)}
.treat.shared{background:var(--t-shared)} .treat.light{background:var(--t-light)}
.treat.escalate{background:var(--t-escalate)}

select,input[type=number],input[type=text]{font-family:inherit; font-size:13px; padding:4px 6px; border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--ink)}
input[type=range]{accent-color:var(--blue)}

/* workspace */
.ws-grid{display:grid; grid-template-columns:1fr; gap:18px}
.theme{border:1px solid var(--line); border-radius:4px; margin-bottom:12px}
.theme>h3{margin:0; padding:8px 12px; background:#EEF3F8; font-size:14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line)}
.ev{display:grid; grid-template-columns:1fr auto; gap:6px 12px; padding:10px 12px; border-bottom:1px solid #EEF2F6; align-items:start}
.ev:last-child{border-bottom:none}
.ev .why{font-size:12px; color:var(--steel); grid-column:1/2}
.ev .ctrls{grid-column:2/3; display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
.ev .fname{font-size:12px; color:var(--green); grid-column:1/3}
.meter{height:14px; background:#E4EAF0; border-radius:7px; overflow:hidden; border:1px solid var(--line)}
.meter>span{display:block; height:100%; background:var(--green)}
.kv{display:grid; grid-template-columns:1fr auto; gap:4px 14px; font-size:13px}
.kv .k{color:var(--steel)}
.kv .v{text-align:right; font-weight:700; font-variant-numeric:tabular-nums}
.gate{padding:10px 12px; border-radius:4px; font-weight:700; border:1px solid}
.gate.open{background:#E4F3EA; border-color:var(--green); color:var(--green)}
.gate.closed{background:#FDF3D7; border-color:var(--amber); color:#8a6400}
.commit{background:#E7F0FF; border:1px solid var(--blue); border-radius:4px; padding:8px 12px; font-size:13px; margin:4px 0}
.cols2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.cols3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
@media(max-width:860px){.cols2,.cols3{grid-template-columns:1fr}}
.qr{width:96px;height:96px;border:2px solid var(--ink); display:grid; place-items:center; font-size:11px; text-align:center; color:var(--steel); background:repeating-linear-gradient(45deg,#fff,#fff 6px,#eef 6px,#eef 12px)}

/* claims */
.claim{border:1px solid var(--line); border-radius:4px; padding:12px; margin-bottom:10px}
.claim .status{font-weight:700; padding:2px 9px; border-radius:2px; font-size:12px; color:#fff}
.status.allowed{background:var(--green)} .status.qualifier{background:var(--amber)} .status.blocked{background:var(--red)}
.approved{background:#EEF3F8; border-left:4px solid var(--blue); padding:8px 12px; margin-top:8px; font-size:14px}
.unknown{color:var(--red); font-size:13px}
.statbig{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--blue)}
.statrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px}
.statcard{border:1px solid var(--line); border-radius:4px; padding:12px; background:#fff}
.statcard .lbl{font-size:12px; color:var(--steel)}

footer{padding:16px 22px; color:var(--steel); font-size:12px; border-top:1px solid var(--line); text-align:center}
.help{font-size:12px; color:var(--steel)}
.note{font-size:12px; color:var(--steel); font-style:italic}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="en">Merit Supplier Bridge</span>
    <span class="sub" id="brandSub">Puente de Proveedores · 供应商桥梁</span>
  </div>
  <div class="spacer"></div>
  <div class="langsw" role="group" aria-label="Language">
    <button data-lang="en" aria-pressed="true">EN</button>
    <button data-lang="es" aria-pressed="false">ES</button>
    <button data-lang="zh" aria-pressed="false">中文</button>
  </div>
  <button class="btn ghost sm" id="resetBtn"></button>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-tab="triage" id="tab-triage"></button>
  <button role="tab" aria-selected="false" data-tab="workspace" id="tab-workspace"></button>
  <button role="tab" aria-selected="false" data-tab="claims" id="tab-claims"></button>
</nav>

<main>
  <!-- ============ TRIAGE ============ -->
  <section class="view active" id="view-triage" role="tabpanel">
    <div class="panel">
      <div class="hdr"><span class="ttl" data-i="triage.title"></span><span class="spacer" style="flex:1"></span><span class="illus" data-i="illus"></span></div>
      <div class="bd">
        <p class="help" data-i="triage.lede"></p>
        <div class="controls">
          <div class="ctl">
            <label data-i="triage.rankby"></label>
            <div class="toggle" role="group">
              <button id="rankSpend" aria-pressed="false" data-i="triage.byspend"></button>
              <button id="rankRisk" aria-pressed="true" data-i="triage.byrisk"></button>
            </div>
          </div>
          <div class="ctl">
            <label for="topN"><span data-i="triage.topn"></span>: <b id="topNval">8</b></label>
            <input type="range" id="topN" min="3" max="16" value="8">
          </div>
          <div class="readout" id="readout"></div>
        </div>
      </div>
    </div>

    <div class="triage-grid">
      <div class="panel">
        <div class="hdr"><span class="ttl" data-i="triage.matrixttl"></span><span class="meta">RISK = I × V</span></div>
        <div class="bd">
          <div id="matrixWrap"></div>
          <p class="help" data-i="triage.matrixhelp"></p>
        </div>
      </div>

      <div class="panel">
        <div class="hdr"><span class="ttl" data-i="triage.tablettl"></span><span class="meta" id="rowcount"></span></div>
        <div class="bd" style="padding:0">
          <div class="tblwrap">
            <table id="supTable"><thead id="supHead"></thead><tbody id="supBody"></tbody></table>
          </div>
        </div>
      </div>
    </div>

    <div class="panel" id="detailPanel" style="display:none">
      <div class="hdr"><span class="ttl" id="detailTtl"></span><span class="meta" id="detailMeta"></span>
        <span style="flex:1"></span><button class="btn sec sm" id="detailClose">×</button></div>
      <div class="bd"><div class="cols2" id="detailBody"></div></div>
    </div>
  </section>

  <!-- ============ WORKSPACE ============ -->
  <section class="view" id="view-workspace" role="tabpanel">
    <div class="panel">
      <div class="hdr"><span class="ttl" data-i="ws.title"></span><span style="flex:1"></span><span class="illus" data-i="illus"></span></div>
      <div class="bd">
        <p class="help" data-i="ws.lede"></p>
        <div class="controls">
          <div class="ctl"><label for="wsSel" data-i="ws.pick"></label>
            <select id="wsSel"></select></div>
          <button class="btn sm" id="exportBtn" data-i="ws.export"></button>
          <button class="btn sec sm" id="printBtn" data-i="ws.print"></button>
        </div>
      </div>
    </div>

    <div class="cols2">
      <div>
        <div id="themes"></div>
      </div>
      <div>
        <div class="panel">
          <div class="hdr"><span class="ttl" data-i="ws.readiness"></span></div>
          <div class="bd" id="readinessBox"></div>
        </div>
        <div class="panel">
          <div class="hdr"><span class="ttl" data-i="ws.calc"></span></div>
          <div class="bd" id="calcBox"></div>
        </div>
        <div class="panel">
          <div class="hdr"><span class="ttl" data-i="ws.support"></span></div>
          <div class="bd" id="supportBox"></div>
        </div>
        <div class="panel">
          <div class="hdr"><span class="ttl" data-i="ws.commitments"></span></div>
          <div class="bd" id="commitBox"></div>
        </div>
        <div class="panel">
          <div class="hdr"><span class="ttl" data-i="ws.voice"></span><span style="flex:1"></span><span class="illus" data-i="ws.prototype"></span></div>
          <div class="bd" id="voiceBox"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ CLAIMS ============ -->
  <section class="view" id="view-claims" role="tabpanel">
    <div class="panel">
      <div class="hdr"><span class="ttl" data-i="cl.title"></span><span style="flex:1"></span><span class="illus" data-i="illus"></span></div>
      <div class="bd">
        <p class="help" data-i="cl.lede"></p>
        <div class="statrow" id="clStats"></div>
      </div>
    </div>

    <div class="panel">
      <div class="hdr"><span class="ttl" data-i="cl.builder"></span></div>
      <div class="bd">
        <div class="ctl" style="max-width:520px">
          <label for="claimSel" data-i="cl.pick"></label>
          <select id="claimSel"></select>
        </div>
        <div id="claimOut" style="margin-top:12px"></div>
      </div>
    </div>

    <div class="panel">
      <div class="hdr"><span class="ttl" data-i="cl.audience"></span></div>
      <div class="bd" style="padding:0"><div class="tblwrap" style="max-height:none"><table id="audTable"></table></div></div>
    </div>
  </section>
</main>

<footer>
  <span class="illus" data-i="illus"></span> &nbsp; <span data-i="footer"></span>
</footer>

const THEME_ORDER=["environment","labor","ethics","procurement"];
const STATUSES=["not_started","uploaded","reviewed","verified"];

function seedWorkspace(country, revShare, hoursUsed, preset){
  const grid = country==="CN"?0.570:0.438;
  const items={};
  THEME_ORDER.forEach(th=>EV_ITEMS[th].forEach((it,idx)=>{
    // give each workspace a starting progress profile
    let st="not_started";
    if(preset==="mx"){ st = ["reviewed","uploaded","uploaded","not_started","not_started"][idx%5]; if(th==="labor") st=["reviewed","uploaded","uploaded","uploaded","uploaded"][idx%5]; }
    if(preset==="cn"){ st = ["uploaded","not_started","not_started","not_started","not_started"][idx%5]; }
    items[it.id]={status:st, file:""};
  }));
  return {items, energy:{kwh:country==="CN"?840000:520000, diesel:12000, gas:38000, gridf:grid, dieself:2.68, gasf:1.89, revShare, eeiof:0.35}, hours:{budget:40, used:hoursUsed}, feeCovered:true};
}

/* ---------------- helpers ---------------- */
function t(key){ const d=I18N[state.lang]; return (d && d[key]!==undefined)?d[key]:(I18N.en[key]!==undefined?I18N.en[key]:key); }
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;

function wsEvidenceScore(wsId){
  // derive the "evidence status" invisibility sub-factor from workspace progress
  const ws=state.workspaces[wsId]; if(!ws) return null;
  const vals=Object.values(ws.items).map(i=>i.status);
  const n=vals.length;
  const upOrBetter=vals.filter(s=>s!=="not_started").length;
  const reviewed=vals.filter(s=>s==="reviewed"||s==="verified").length;
  const verified=vals.filter(s=>s==="verified").length;
  if(upOrBetter===0) return 5;                    // none
  if(verified>=Math.ceil(0.8*n)) return 1;        // third-party equivalent
  if(reviewed>=Math.ceil(0.5*n)) return 2;        // partial reviewed -> nearly visible
  if(reviewed>0) return 3;                        // some reviewed
  return 4;                                        // uploaded but self-reported only
}

function irrScore(s){ return avg([SCORE.alt[s.irr.alt],SCORE.requal[s.irr.requal],SCORE.inv[s.irr.inv],SCORE.clin[s.irr.clin]]); }
function visScore(s){
  const evid = s.ws ? wsEvidenceScore(s.ws) : SCORE.evid[s.vis.evid];
  return avg([evid, regionScore(s.country), SCORE.staff[s.vis.staff], SCORE.onsite[s.vis.onsite]]);
}
function treatmentOf(s){
  if(s.redFlag) return "escalate";
  const I=irrScore(s), V=visScore(s);
  const hiI=I>=3.5, hiV=V>=3.5;
  if(hiI&&hiV) return "support";
  if(hiI&&!hiV) return "harvest";
  if(!hiI&&hiV) return "shared";
  return "light";
}
function fmtMoney(v){ return "$"+(v/1e6).toFixed(1)+"M"; }

/* ---------------- TRIAGE ---------------- */
function rowsSorted(){
  const rows=state.suppliers.map(s=>({s, I:irrScore(s), V:visScore(s), risk:irrScore(s)*visScore(s)}));
  // spend rank (always by spend desc)
  const byspend=[...rows].sort((a,b)=>b.s.spend-a.s.spend);
  byspend.forEach((r,i)=>r.spendRank=i+1);
  if(state.rankMode==="spend") rows.sort((a,b)=>b.s.spend-a.s.spend);
  else rows.sort((a,b)=>b.risk-a.risk);
  return rows;
}
function topNids(){
  const rows=state.suppliers.map(s=>({s}));
  const key = state.rankMode==="spend" ? (r=>r.s.spend) : (r=>irrScore(r.s)*visScore(r.s));
  rows.sort((a,b)=>key(b)-key(a));
  return new Set(rows.slice(0,state.topN).map(r=>r.s.id));
}

function renderTriage(){
  // controls
  document.getElementById("rankSpend").setAttribute("aria-pressed", state.rankMode==="spend");
  document.getElementById("rankRisk").setAttribute("aria-pressed", state.rankMode==="risk");
  document.getElementById("topN").value=state.topN;
  document.getElementById("topNval").textContent=state.topN;

  const rows=rowsSorted();
  const top=topNids();
  // readout: top N by spend includes X of Y support-first
  const supportIds=state.suppliers.filter(s=>treatmentOf(s)==="support").map(s=>s.id);
  const bySpend=[...state.suppliers].sort((a,b)=>b.spend-a.spend).slice(0,state.topN).map(s=>s.id);
  const inc=supportIds.filter(id=>bySpend.includes(id)).length;
  const ro=document.getElementById("readout");
  ro.innerHTML = t("triage.readout").replace("{n}",`<b>${state.topN}</b>`).replace("{x}",`<b>${inc}</b>`).replace("{y}",`<b>${supportIds.length}</b>`).replace("{t}",t("treat.support"));

  // table
  const head=document.getElementById("supHead");
  head.innerHTML="<tr>"+["col.name","col.country","col.cat","col.spend","col.rank","col.irr","col.inv","col.risk","col.treat"].map(k=>`<th>${t(k)}</th>`).join("")+"</tr>";
  const body=document.getElementById("supBody"); body.innerHTML="";
  rows.forEach(r=>{
    const tr=document.createElement("tr");
    if(top.has(r.s.id)) tr.className="topn";
    const tr_treat=treatmentOf(r.s);
    tr.innerHTML=`<td>${r.s.name}${r.s.redFlag?' <span title="red flag">⚑</span>':''}</td>`+
      `<td>${r.s.country}</td><td>${r.s.cat}</td>`+
      `<td class="num">${fmtMoney(r.s.spend)}</td><td class="num">#${r.spendRank}</td>`+
      `<td class="num">${r.I.toFixed(1)}</td><td class="num">${r.V.toFixed(1)}</td>`+
      `<td class="num">${r.risk.toFixed(1)}</td>`+
      `<td><span class="treat ${tr_treat}">${t("treat."+tr_treat)}</span></td>`;
    tr.addEventListener("click",()=>openDetail(r.s.id));
    body.appendChild(tr);
  });
  document.getElementById("rowcount").textContent=rows.length+" rows";

  renderMatrix(top);
}

function renderMatrix(top){
  const W=560,H=520,pad=56;
  const sx=v=>pad+((v-0.5)/(5.5-0.5))*(W-pad-20);   // invisibility x
  const sy=v=>H-pad-((v-0.5)/(5.5-0.5))*(H-pad-20);  // irreplaceability y
  const thr=3.5;
  const maxSpend=Math.max(...state.suppliers.map(s=>s.spend));
  const rad=sp=>6+Math.sqrt(sp/maxSpend)*22;
  const col={support:"#D9480F",harvest:"#2563C9",shared:"#D6A20A",light:"#16A085",escalate:"#8B1E1E"};
  let dots="";
  state.suppliers.forEach(s=>{
    const I=irrScore(s),V=visScore(s),tr=treatmentOf(s);
    dots+=`<circle class="dot" data-id="${s.id}" cx="${sx(V).toFixed(1)}" cy="${sy(I).toFixed(1)}" r="${rad(s.spend).toFixed(1)}" fill="${col[tr]}" fill-opacity="0.72" stroke="#13243A" stroke-width="1">`+
      `<title>${s.name} — I ${I.toFixed(1)}, V ${V.toFixed(1)}, ${fmtMoney(s.spend)}</title></circle>`;
    if(top.has(s.id)) dots+=`<circle cx="${sx(V).toFixed(1)}" cy="${sy(I).toFixed(1)}" r="${(rad(s.spend)+4).toFixed(1)}" fill="none" stroke="#E8A317" stroke-width="2" pointer-events="none"/>`;
  });
  // quadrant labels
  const qlab=(x,y,txt,anchor)=>`<text x="${x}" y="${y}" font-size="13" font-weight="700" fill="#6B7A8C" text-anchor="${anchor}">${txt}</text>`;
  const svg=`<svg class="matrix" viewBox="0 0 ${W} ${H}" role="img" aria-label="Risk matrix">
    <rect x="${pad}" y="20" width="${W-pad-20}" height="${H-pad-20}" fill="#FBFDFF" stroke="#C9D3DD"/>
    <line x1="${sx(thr)}" y1="20" x2="${sx(thr)}" y2="${H-pad}" stroke="#C9D3DD" stroke-dasharray="5 4"/>
    <line x1="${pad}" y1="${sy(thr)}" x2="${W-20}" y2="${sy(thr)}" stroke="#C9D3DD" stroke-dasharray="5 4"/>
    ${qlab(W-26,sy(4.9),t("treat.support"),"end")}
    ${qlab(pad+6,sy(4.9),t("treat.harvest"),"start")}
    ${qlab(W-26,H-pad-6,t("treat.shared"),"end")}
    ${qlab(pad+6,H-pad-6,t("treat.light"),"start")}
    <text x="${W/2}" y="${H-16}" font-size="13" font-weight="700" fill="#13243A" text-anchor="middle">${t("col.inv")} →</text>
    <text x="16" y="${H/2}" font-size="13" font-weight="700" fill="#13243A" text-anchor="middle" transform="rotate(-90 16 ${H/2})">${t("col.irr")} →</text>
    ${dots}
  </svg>`;
  document.getElementById("matrixWrap").innerHTML=svg;
  document.querySelectorAll("svg .dot").forEach(c=>c.addEventListener("click",()=>openDetail(c.dataset.id)));
}

function dropdown(group, val, onchange){
  const sel=document.createElement("select");
  OPT[group].forEach(o=>{
    const opt=document.createElement("option"); opt.value=o; opt.textContent=t("o."+group+"."+o);
    if(o===val) opt.selected=true; sel.appendChild(opt);
  });
  sel.addEventListener("change",()=>onchange(sel.value));
  return sel;
}
function openDetail(id){
  const s=state.suppliers.find(x=>x.id===id); if(!s)return;
  const p=document.getElementById("detailPanel"); p.style.display="block";
  document.getElementById("detailTtl").textContent=s.name;
  document.getElementById("detailMeta").textContent=`${s.country} · ${s.cat} · ${fmtMoney(s.spend)} · RISK ${(irrScore(s)*visScore(s)).toFixed(1)}`;
  const body=document.getElementById("detailBody"); body.innerHTML="";

  // IRR col
  const c1=document.createElement("div");
  c1.innerHTML=`<h3>${t("detail.irr")} — ${irrScore(s).toFixed(1)}</h3>`;
  [["alt","f.alt","alt"],["requal","f.requal","requal"],["inv","f.inv","inv"],["clin","f.clin","clin"]].forEach(([k,lbl,grp])=>{
    const row=document.createElement("div"); row.className="kv"; row.style.marginBottom="6px";
    const lab=document.createElement("div"); lab.className="k"; lab.textContent=t(lbl);
    const d=dropdown(grp, s.irr[k], v=>{ s.irr[k]=v; save(); renderTriage(); openDetail(id); });
    row.appendChild(lab); row.appendChild(d); c1.appendChild(row);
  });
  // red flag
  const rf=document.createElement("label"); rf.style.display="flex"; rf.style.gap="8px"; rf.style.marginTop="10px"; rf.style.fontWeight="700"; rf.style.color="#C0392B";
  const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=s.redFlag;
  cb.addEventListener("change",()=>{ s.redFlag=cb.checked; save(); renderTriage(); openDetail(id); });
  rf.appendChild(cb); rf.appendChild(document.createTextNode(t("redflag"))); c1.appendChild(rf);

  // VIS col
  const c2=document.createElement("div");
  c2.innerHTML=`<h3>${t("detail.inv")} — ${visScore(s).toFixed(1)}</h3>`;
  // evidence status
  const er=document.createElement("div"); er.className="kv"; er.style.marginBottom="6px";
  const el=document.createElement("div"); el.className="k"; el.textContent=t("f.evid");
  if(s.ws){
    const v=document.createElement("div"); v.className="v"; v.innerHTML=`${wsEvidenceScore(s.ws).toFixed(1)}<br><span class="note">${t("detail.derived")}</span>`;
    er.appendChild(el); er.appendChild(v);
  } else {
    const d=dropdown("evid", s.vis.evid, v=>{ s.vis.evid=v; save(); renderTriage(); openDetail(id); });
    er.appendChild(el); er.appendChild(d);
  }
  c2.appendChild(er);
  // region (derived)
  const rr=document.createElement("div"); rr.className="kv"; rr.style.marginBottom="6px";
  rr.innerHTML=`<div class="k">${t("f.region")}</div><div class="v">${regionScore(s.country).toFixed(1)} <span class="note">(${s.country})</span></div>`;
  c2.appendChild(rr);
  [["staff","f.staff","staff"],["onsite","f.onsite","onsite"]].forEach(([k,lbl,grp])=>{
    const row=document.createElement("div"); row.className="kv"; row.style.marginBottom="6px";
    const lab=document.createElement("div"); lab.className="k"; lab.textContent=t(lbl);
    const d=dropdown(grp, s.vis[k], v=>{ s.vis[k]=v; save(); renderTriage(); openDetail(id); });
    row.appendChild(lab); row.appendChild(d); c2.appendChild(row);
  });

  body.appendChild(c1); body.appendChild(c2);
}

/* ---------------- WORKSPACE ---------------- */
function wsSupplier(){ return state.suppliers.find(s=>s.ws===state.wsCurrent); }
function statusClass(st){ return {not_started:"ns",uploaded:"up",reviewed:"rv",verified:"vf"}[st]; }

function renderWorkspace(){
  // selector
  const sel=document.getElementById("wsSel"); sel.innerHTML="";
  state.suppliers.filter(s=>s.ws).forEach(s=>{
    const o=document.createElement("option"); o.value=s.ws; o.textContent=`${s.name} (${s.country})`;
    if(s.ws===state.wsCurrent)o.selected=true; sel.appendChild(o);
  });

  // themes + items
  const box=document.getElementById("themes"); box.innerHTML="";
  THEME_ORDER.forEach(th=>{
    const items=EV_ITEMS[th];
    const done=items.filter(it=>ws.items[it.id].status!=="not_started").length;

    wrap.innerHTML=`<h3>${t("th."+th)} <span class="note">${done}/${items.length}</span></h3>`;

      const cur=ws.items[it.id];

      const why=document.createElement("div"); why.className="why";
      why.innerHTML=`<b>${it.label[state.lang]}</b><br>${it.why[state.lang]}`;
      const ctr=document.createElement("div"); ctr.className="ctrls";
      // status select styled as tag
      const chip=document.createElement("span"); chip.className="tag "+statusClass(cur.status); chip.textContent=t("st."+cur.status);
      const stsel=document.createElement("select");

      stsel.addEventListener("change",()=>{cur.status=stsel.value; save(); renderWorkspace(); });
      const file=document.createElement("input"); file.type="file"; file.style.maxWidth="150px"; file.setAttribute("aria-label",t("ws.attach"));
      file.addEventListener("change",()=>{ cur.file=file.files[0]?file.files[0].name:""; if(cur.status==="not_started"&&cur.file){cur.status="uploaded";} save(); renderWorkspace(); });
      ctr.appendChild(chip); ctr.appendChild(stsel); ctr.appendChild(file);
      ev.appendChild(why); ev.appendChild(ctr);
      if(cur.file){ const fn=document.createElement("div"); fn.className="fname"; fn.textContent="📎 "+cur.file; ev.appendChild(fn); }
      wrap.appendChild(ev);
    });
    box.appendChild(wrap);
  });

  renderReadiness(ws);
  renderCalc(ws, sup);
  renderSupport(ws);
  renderCommit();
  renderVoice();
}

function themePct(ws,th){ const items=EV_ITEMS[th]; const up=items.filter(it=>ws.items[it.id].status!=="not_started").length; return up/items.length; }
function overallPct(ws){ const all=Object.values(ws.items); return all.filter(i=>i.status!=="not_started").length/all.length; }
function gateOpen(ws){
  const overall=overallPct(ws);
  const laborOk=EV_ITEMS.labor.every(it=>ws.items[it.id].status!=="not_started");
  return overall>=0.8 && laborOk;
}
function renderReadiness(ws){
  const box=document.getElementById("readinessBox");
  let html="";
  THEME_ORDER.forEach(th=>{
    const pct=Math.round(themePct(ws,th)*100);
    html+=`<div style="margin-bottom:8px"><div class="kv"><span class="k">${t("th."+th)}</span><span class="v">${pct}%</span></div><div class="meter"><span style="width:${pct}%"></span></div></div>`;
  });
  const op=Math.round(overallPct(ws)*100);
  html+=`<div style="margin:12px 0 8px"><div class="kv"><span class="k"><b>${t("ws.overall")}</b></span><span class="v">${op}%</span></div><div class="meter"><span style="width:${op}%;background:#2563C9"></span></div></div>`;
  const open=gateOpen(ws);
  html+=`<div class="gate ${open?'open':'closed'}">${open?t("ws.gateopen"):t("ws.gateclosed")}</div>`;
  html+=`<p class="note">${t("ws.gaterule")}</p>`;
  box.innerHTML=html;
}

function renderCalc(ws, sup){
  const e=ws.energy;
  const siteCo2 = (e.kwh*e.gridf + e.diesel*e.dieself + e.gas*e.gasf)/1000; // tCO2e
  const attrib = siteCo2 * e.revShare;
  const spendEstimate = (sup.spend * e.eeiof)/1000; // tCO2e
  const num=(lbl,val,step,min)=>`<div class="kv" style="margin-bottom:6px"><label class="k">${lbl}</label><input type="number" data-f="${val}" value="${e[val]}" step="${step}" min="${min||0}" style="width:120px"></div>`;
  document.getElementById("calcBox").innerHTML=
    num(t("ws.kwh"),"kwh",1000)+num(t("ws.diesel"),"diesel",100)+num(t("ws.gas"),"gas",100)+
    `<hr style="border:none;border-top:1px solid #E4EAF0;margin:8px 0">`+
    num(t("ws.gridf"),"gridf",0.001)+num(t("ws.dieself"),"dieself",0.01)+num(t("ws.gasf"),"gasf",0.01)+
    `<p class="note">${t("ws.factnote")}</p>`+
    `<div class="kv" style="margin:6px 0"><span class="k"><b>${t("ws.totalco2")}</b></span><span class="v">${siteCo2.toFixed(1)} tCO₂e</span></div>`+
    num(t("ws.revshare"),"revShare",0.01)+
    `<div class="cols2" style="margin-top:10px">
       <div class="statcard"><div class="lbl">${t("ws.attrib")}</div><div class="statbig">${attrib.toFixed(1)}</div><div class="note">tCO₂e</div></div>
       <div class="statcard" style="background:#F1F4F7"><div class="lbl">${t("ws.eeio")}</div><div class="statbig" style="color:#6B7A8C">${spendEstimate.toFixed(1)}</div><div class="note">tCO₂e — ${t("ws.eeiof")}</div>${num(t("ws.eeiof"),"eeiof",0.01)}</div>
     </div>
     <p class="note">${t("ws.eeionote")}</p>`;
  document.querySelectorAll('#calcBox input[data-f]').forEach(inp=>{
    inp.addEventListener("input",()=>{ let v=parseFloat(inp.value); if(isNaN(v))v=0; e[inp.dataset.f]=v; save();
      // revShare bounded
      if(inp.dataset.f==="revShare"&&v>1){e.revShare=v/100;} renderCalc(ws,sup); });
  });
}

function renderSupport(ws){
  const open=gateOpen(ws);
  const rem=ws.hours.budget-ws.hours.used;
  document.getElementById("supportBox").innerHTML=

function exportPack(){
  const sup=wsSupplier(); const ws=state.workspaces[state.wsCurrent];
  const e=ws.energy;
  const siteCo2=(e.kwh*e.gridf+e.diesel*e.dieself+e.gas*e.gasf)/1000;
  const register={
    generated:new Date().toISOString(),
    note:"Illustrative data — Merit Supplier Bridge prototype. No files are uploaded.",
    supplier:{name:sup.name,country:sup.country,category:sup.cat},
    readiness:{overallPct:Math.round(overallPct(ws)*100), ecoVadisReady:gateOpen(ws)},
    evidence:Object.entries(ws.items).map(([id,v])=>({item:id,status:v.status,file:v.file||null})),
    emissions:{siteTCO2e:+siteCo2.toFixed(2), revShare:e.revShare, attributableTCO2e:+(siteCo2*e.revShare).toFixed(2), spendEstimateTCO2e:+((sup.spend*e.eeiof)/1000).toFixed(2)}
  };
  const blob=new Blob([JSON.stringify(register,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="evidence-pack-"+state.wsCurrent+".json"; a.click(); URL.revokeObjectURL(a.href);
}
function printSummary(){
  const sup=wsSupplier(); const ws=state.workspaces[state.wsCurrent];
  const rows=Object.entries(ws.items).map(([id,v])=>`<tr><td>${id}</td><td>${t("st."+v.status)}</td><td>${v.file||"—"}</td></tr>`).join("");
  const w=window.open("","_blank");
  w.document.write(`<html><head><title>${sup.name} — evidence</title><style>body{font-family:sans-serif;padding:24px;color:#13243A}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px;text-align:left}</style></head>
   <body><h1>${sup.name}</h1><p>${sup.country} · ${sup.cat} · Readiness ${Math.round(overallPct(ws)*100)}% · ${t("illus")}</p>
   <table><thead><tr><th>Item</th><th>Status</th><th>File</th></tr></thead><tbody>${rows}</tbody></table></body></html>`);
  w.document.close(); w.print();
}

/* ---------------- CLAIMS ---------------- */
function programStats(){
  const sup=state.suppliers;
  const treat={support:0,harvest:0,shared:0,light:0,escalate:0};
  sup.forEach(s=>treat[treatmentOf(s)]++);
  // support-first with reviewed evidence (workspace reviewed>0) — proxy: ws suppliers with >=1 reviewed
  const supportFirst=sup.filter(s=>treatmentOf(s)==="support");
  const supportReviewed=supportFirst.filter(s=>{
    if(!s.ws){ return s.vis.evid==="partial"||s.vis.evid==="third"; }
    const vals=Object.values(state.workspaces[s.ws].items).map(i=>i.status);
    return vals.some(x=>x==="reviewed"||x==="verified");
  }).length;
  // spend covered by EcoVadis/equiv: suppliers with evid==third (or ws verified>=80%)
  const totalSpend=sup.reduce((a,s)=>a+s.spend,0);
  const covSpend=sup.filter(s=>{
    if(s.ws) return wsEvidenceScore(s.ws)<=1;
    return s.vis.evid==="third";
  }).reduce((a,s)=>a+s.spend,0);
  // critical suppliers covered: clin==critical with reviewed-or-better evidence
  const crit=sup.filter(s=>s.irr.clin==="critical");
  const critCovered=crit.filter(s=>{
    if(s.ws){ return Object.values(state.workspaces[s.ws].items).some(i=>i.status==="reviewed"||i.status==="verified"); }
    return s.vis.evid==="partial"||s.vis.evid==="third";
  }).length;
  // Scope3 cat1 supplier-specific: fraction of ws suppliers with calc done vs all = proxy by count ws / suppliers engaged
  const wsCount=sup.filter(s=>s.ws).length;
  const s3=wsCount/sup.length;
  return {treat,supportFirst:supportFirst.length,supportReviewed,
    spendCovPct: totalSpend?covSpend/totalSpend:0,
    crit:crit.length,critCovered,
    critPct:crit.length?critCovered/crit.length:0,
    s3Pct:s3};
}
function renderClaimsStats(){
  const s=programStats();
  const box=document.getElementById("clStats");
  const card=(lbl,big,sub)=>`<div class="statcard"><div class="lbl">${lbl}</div><div class="statbig">${big}</div><div class="note">${sub||""}</div></div>`;
  const treatStr=["support","harvest","shared","light","escalate"].map(k=>`${t("treat."+k)}: ${s.treat[k]}`).join(" · ");
  box.innerHTML=
    card(t("stat.bytreat"),"",treatStr)+
    card(t("stat.supportrev"),`${s.supportFirst?Math.round(s.supportReviewed/s.supportFirst*100):0}%`,`${s.supportReviewed}/${s.supportFirst}`)+
    card(t("stat.spendcov"),`${Math.round(s.spendCovPct*100)}%`)+
    card(t("stat.critcov"),`${Math.round(s.critPct*100)}%`,`${s.critCovered}/${s.crit}`)+
    card(t("stat.s3"),`${Math.round(s.s3Pct*100)}%`);
}
function evalClaim(id){
  const s=programStats();
  const C=CLAIMS.find(c=>c.id===id);
  let status,tier,coverage,unknown,wording;
  if(C.kind==="vague"){
    status="blocked"; tier="—"; coverage="—";
    unknown={en:"\"Sustainable/green\" is an unqualified general-benefit claim.",es:"\"Sostenible/verde\" es una afirmación general sin matiz.",zh:"\"可持续/绿色\"属无限定的笼统收益声明。"}[state.lang];
    wording={en:"Blocked — FTC Green Guides: unqualified general environmental benefit claims are not allowed. Use a specific, evidenced coverage figure instead.",es:"Bloqueada — FTC Green Guides: no se permiten afirmaciones ambientales generales sin matiz. Use una cifra de cobertura específica y respaldada.",zh:"禁止——依据 FTC Green Guides：不允许无限定的笼统环境收益声明。改用具体、有证据的覆盖数据。"}[state.lang];
  } else if(C.kind==="neutral"){
    status="blocked"; tier="—"; coverage="—";
    unknown={en:"Offset-based product-level neutrality cannot be substantiated here.",es:"La neutralidad por compensación a nivel de producto no puede sustentarse aquí.",zh:"基于抵消的产品级中和在此无法证实。"}[state.lang];
    wording={en:"Blocked — EU Empowering Consumers Directive (EU) 2024/825 (applies from 27 Sept 2026) prohibits offset-based \"climate neutral\" product claims.",es:"Bloqueada — Directiva (UE) 2024/825 (desde 27 sept 2026) prohíbe afirmaciones de \"climáticamente neutro\" basadas en compensaciones.",zh:"禁止——欧盟《赋能消费者指令》(EU) 2024/825（自2026年9月27日适用）禁止基于抵消的\"气候中和\"产品声明。"}[state.lang];
  } else if(C.kind==="reduction"){
    status="blocked"; tier=t("cl.tier.reviewed"); coverage="—";
    unknown={en:"Needs two years of supplier-specific data to show a real reduction. Prototype has one period.",es:"Requiere dos años de datos específicos para mostrar una reducción real. El prototipo tiene un periodo.",zh:"需要两年供应商专属数据才能证明真实减排。原型仅有一期。"}[state.lang];
    wording={en:"Blocked — reduction claims are not allowed until at least two years of supplier-specific data exist. Report absolute emissions by tier meanwhile.",es:"Bloqueada — las afirmaciones de reducción no se permiten hasta tener al menos dos años de datos específicos.",zh:"禁止——在至少两年供应商专属数据之前不得做减排声明。期间可按等级报告绝对排放。"}[state.lang];
  } else if(C.kind==="coverage_crit"){
    const pct=Math.round(s.critPct*100);
    status="qualifier"; tier=t("cl.tier.reviewed"); coverage=`${s.critCovered}/${s.crit} ${t("col.name").toLowerCase()} · 2026`;
    unknown={en:"Covers reviewed evidence only, not yet all independently verified on site.",es:"Cubre evidencia revisada, aún no toda verificada en sitio.",zh:"仅覆盖已审阅证据，尚未全部现场独立核验。"}[state.lang];
    wording={en:`${pct}% of our critical suppliers (${s.critCovered} of ${s.crit}) have Merit-reviewed sustainability evidence as of 2026; on-site verification is in progress.`,
      es:`El ${pct}% de nuestros proveedores críticos (${s.critCovered} de ${s.crit}) tienen evidencia revisada por Merit a 2026; la verificación en sitio está en curso.`,
      zh:`截至2026年，我们 ${pct}% 的关键供应商（${s.critCovered}/${s.crit}）拥有经 Merit 审阅的可持续证据；现场核验进行中。`}[state.lang];
  } else { // coverage_spend
    const pct=Math.round(s.spendCovPct*100);
    status="qualifier"; tier=t("cl.tier.third"); coverage=`${pct}% ${t("col.spend").toLowerCase()} · 2026`;
    unknown={en:"Spend-weighted; many small irreplaceable suppliers remain uncovered by headline spend figure.",es:"Ponderado por gasto; muchos proveedores pequeños e insustituibles siguen sin cubrir.",zh:"按采购额加权；许多不可替代的小供应商未被该采购额口径覆盖。"}[state.lang];
    wording={en:`${pct}% of our supplier spend in 2026 is covered by EcoVadis or equivalent third-party assessments. This figure is spend-weighted and does not reflect supplier count.`,
      es:`El ${pct}% de nuestro gasto en proveedores en 2026 está cubierto por EcoVadis o evaluaciones de terceros equivalentes. Esta cifra se pondera por gasto.`,
      zh:`2026年我们 ${pct}% 的供应商采购额已被 EcoVadis 或同等第三方评估覆盖。该数字按采购额加权，不代表供应商数量。`}[state.lang];
  }
  return {status,tier,coverage,unknown,wording};
}
function renderClaimBuilder(){
  const sel=document.getElementById("claimSel"); sel.innerHTML="";
  CLAIMS.forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.label[state.lang];if(c.id===state.claimCurrent)o.selected=true;sel.appendChild(o);});
  const r=evalClaim(state.claimCurrent);
  const sc={allowed:"allowed",qualifier:"qualifier",blocked:"blocked"}[r.status];
  const slabel={allowed:t("st.allowed"),qualifier:t("st.qualifier"),blocked:t("st.blocked")}[r.status];
  document.getElementById("claimOut").innerHTML=
    `<div class="claim">
      <div style="margin-bottom:8px"><span class="status ${sc}">${slabel}</span></div>
      <div class="kv" style="margin-bottom:4px"><span class="k">${t("cl.evtier")}</span><span class="v">${r.tier}</span></div>

}

function switchTab(tab){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active", v.id==="view-"+tab));
}

function init(){
  load();
  // optional deep-link for demo/testing: ?lang=es&tab=claims
  try{ const q=new URLSearchParams(location.search);
    if(q.get("lang")&&I18N[q.get("lang")]) state.lang=q.get("lang"); }catch(e){}
  document.querySelectorAll(".langsw button").forEach(b=>b.addEventListener("click",()=>{ state.lang=b.dataset.lang; save(); renderAll(); }));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));
  document.getElementById("resetBtn").addEventListener("click",()=>{ if(confirm(t("reset")+"?")){ localStorage.removeItem(LS_KEY); state=freshState(); save(); renderAll(); switchTab("triage"); }});
  document.getElementById("rankSpend").addEventListener("click",()=>{state.rankMode="spend";save();renderTriage();});
  document.getElementById("rankRisk").addEventListener("click",()=>{state.rankMode="risk";save();renderTriage();});
  document.getElementById("topN").addEventListener("input",e=>{state.topN=+e.target.value;save();renderTriage();});
  document.getElementById("detailClose").addEventListener("click",()=>{document.getElementById("detailPanel").style.display="none";});
  document.getElementById("wsSel").addEventListener("change",e=>{state.wsCurrent=e.target.value;save();renderWorkspace();});
  document.getElementById("exportBtn").addEventListener("click",exportPack);
  document.getElementById("printBtn").addEventListener("click",printSummary);
  document.getElementById("claimSel").addEventListener("change",e=>{state.claimCurrent=e.target.value;save();renderClaimBuilder();});
  renderAll();
  try{ const q=new URLSearchParams(location.search); if(q.get("tab")) switchTab(q.get("tab")); }catch(e){}
}
document.addEventListener("DOMContentLoaded",init);
